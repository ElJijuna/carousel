name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the whole history to work out the next
          # version from the conventional commits since the last tag.
          fetch-depth: 0
          persist-credentials: false

      # Deliberately no `registry-url`: it makes setup-node write an .npmrc
      # wired to NODE_AUTH_TOKEN, which nothing here sets. @semantic-release/npm
      # writes its own .npmrc from NPM_TOKEN, and the half-configured one left
      # behind makes its auth check fail — taking the GitHub release down with
      # it, since the npm plugin runs first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:coverage

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
